<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskAdriaan - PRTS Handbook Assistant</title>
    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F3F3F4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webchat-container {
            width: 420px;
            height: 620px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(28,28,28,0.12);
            border: 1px solid #e0e0e0;
            background: white;
            resize: both;
            min-width: 320px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (max-width: 768px) {
            body {
                align-items: stretch;
                justify-content: stretch;
            }
            #webchat-container {
                width: 100%;
                border-radius: 0;
                border: none;
                resize: none;
                min-height: unset;
            }
        }

        #header {
            background: white;
            padding: 16px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        #header-content { flex: 1; }
        #header h1 {
            margin: 0 0 2px 0;
            color: #DA2037;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        #header p {
            margin: 0;
            color: #6b6b6b;
            font-size: 12px;
        }

        #fullscreen-btn {
            background: #f5f5f5;
            border: none;
            color: #6b6b6b;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 12px;
        }
        #fullscreen-btn:hover { background: #e8e8e8; color: #DA2037; }

        #webchat {
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* 16px prevents iOS auto-zoom on all browsers */
        #webchat input[type="text"],
        #webchat textarea {
            font-size: 16px !important;
            touch-action: manipulation;
        }

        #webchat-container.fullscreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw !important;
            border-radius: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="webchat-container">
        <div id="header">
            <div id="header-content">
                <h1>AskAdriaan</h1>
                <p>PRTS Handbook Assistant</p>
            </div>
            <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 5V1H5M11 1H15V5M15 11V15H11M5 15H1V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div id="webchat" role="main"></div>
    </div>

    <script>
        const tokenEndpoint = 'https://default61d6eb67cbe542ee8a1373c46652bd.71.environment.api.powerplatform.com/powervirtualagents/botsbyschema/cr2ce_askAdrian/directline/token?api-version=2022-03-01-preview';

        const styleOptions = {
            accent: '#DA2037',
            backgroundColor: 'white',
            bubbleBackground: '#F3F3F4',
            bubbleFromUserBackground: '#D3D8DC',
            bubbleFromUserTextColor: '#1C1C1C',
            bubbleBorderRadius: 16,
            bubbleFromUserBorderRadius: 16,
            bubbleTextColor: '#1C1C1C',
            sendBoxBackground: 'white',
            sendBoxTextColor: '#1C1C1C',
            sendBoxBorderTop: 'solid 1px #f0f0f0',
            sendBoxPlaceholderColor: '#999999',
            sendBoxButtonColor: '#DA2037',
            sendBoxButtonColorOnHover: '#b81a2d',
            sendBoxHeight: 50,
            sendBoxButtonColorOnFocus: '#b81a2d',
            suggestedActionBackground: 'white',
            suggestedActionBorderColor: '#DA2037',
            suggestedActionBorderRadius: 20,
            suggestedActionTextColor: '#DA2037',
            suggestedActionBorderWidth: 1.5,
            timestampColor: '#999999',
            botAvatarBackgroundColor: '#DA2037',
            botAvatarInitials: 'AA',
            userAvatarBackgroundColor: '#1C1C1C',
            userAvatarInitials: '',
            avatarSize: 32,
            avatarBorderRadius: '50%',
            hideUploadButton: false,
            groupTimestamp: 300000
        };

        // Set container height using visualViewport (works on all mobile browsers)
        function setContainerHeight() {
            if (window.innerWidth > 768) return;
            const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.getElementById('webchat-container').style.height = h + 'px';
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setContainerHeight);
        }
        window.addEventListener('resize', setContainerHeight);
        setContainerHeight();

        function attachSendBehavior() {
            const webchatEl = document.getElementById('webchat');
            const observer = new MutationObserver(() => {
                const input = webchatEl.querySelector('input[type="text"], textarea');
                if (!input) return;
                observer.disconnect();

                // Find the send button (rendered by WebChat after the input)
                function getSendBtn() {
                    return webchatEl.querySelector('button[type="submit"], button[aria-label="Send"]');
                }

                // Blur the input after sending so next tap opens the keyboard fresh
                function blurAfterSend() {
                    setTimeout(() => input.blur(), 50);
                }

                // Detect Enter key to send
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        blurAfterSend();
                    }
                });

                // Detect send button tap — use event delegation on the webchat container
                // so it works even if the button re-renders
                webchatEl.addEventListener('click', function(e) {
                    const btn = e.target.closest('button[type="submit"], button[aria-label="Send"]');
                    if (btn) blurAfterSend();
                });

                webchatEl.addEventListener('touchend', function(e) {
                    const btn = e.target.closest('button[type="submit"], button[aria-label="Send"]');
                    if (btn) blurAfterSend();
                }, { passive: true });
            });

            observer.observe(webchatEl, { childList: true, subtree: true });
        }

        async function initWebChat() {
            try {
                const res = await fetch(tokenEndpoint);
                const { token } = await res.json();
                const directLine = window.WebChat.createDirectLine({ token });
                window.WebChat.renderWebChat({ directLine, styleOptions }, document.getElementById('webchat'));
                attachSendBehavior();
            } catch (err) {
                console.error('Error initializing webchat:', err);
                document.getElementById('webchat').innerHTML =
                    '<p style="padding:20px;text-align:center;color:#DA2037;">Unable to load chat. Please refresh the page.</p>';
            }
        }

        initWebChat();

        function toggleFullscreen() {
            const c = document.getElementById('webchat-container');
            c.classList.toggle('fullscreen');
            setContainerHeight();
        }
    </script>
</body>
</html>
